         #with:
          #host: ${{ secrets.SERVER_IP }}
          #username: ${{ secrets.SERVER_USERNAME }}
          #key: ${{ secrets.SERVER_PRIVATE_KEY }}
          #port: 22
          #script: |
           #cd /home/backendsmahi/actions-runner/_work/Backend/Backend/backend
           #./start_daphne.sh
