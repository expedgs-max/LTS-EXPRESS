name: CI/CD - Test & Deploy to VPS

on:
  push:
    branches:
      - main  # Trigger deployment on push to main branch

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.7, 3.8, 3.9]

    steps:
      # Checkout the code
      - uses: actions/checkout@v4

      # Set up Python environment
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      # Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Configure PostgreSQL connection (if using existing database)
      - name: Configure PostgreSQL connection
        env:
          DATABASE_URL: "postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@${{ secrets.POSTGRES_HOST }}:${{ secrets.POSTGRES_PORT }}/${{ secrets.POSTGRES_DB }}"
        run: |
          echo "DATABASE_URL=$DATABASE_URL" >> $GITHUB_ENV

      # Run migrations
      - name: Run Migrations
        run: |
          python manage.py migrate

      # Run tests
      - name: Run Tests
        run: |
          python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: test  # Wait for the test job to complete
    steps:
      # Deploy to VPS if tests pass
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_IP }}  # VPS IP address
          username: ${{ secrets.VPS_USER }}  # VPS username
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}  # Private SSH key
          port: 22  # Port to SSH, default is 22
          script: "cd home/backendsmahi/Backend/backend && ./.scripts/deploy.sh"